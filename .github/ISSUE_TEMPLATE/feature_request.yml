name: Pasiūlymas / Feature request
description: Pasiūlyti patobulinimą / Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: Kokią problemą norite išspręsti? / What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Siūlomas sprendimas / Proposed solution
